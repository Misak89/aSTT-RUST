name: Documentation Check

on:
  push:
    branches: [main, develop]
    paths:
      - '**.md'
      - 'scripts/**'
      - '.mega-linter.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.md'
      - 'scripts/**'
      - '.mega-linter.yml'

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for duplicates
        run: powershell -ExecutionPolicy Bypass -File scripts/check_duplicates.ps1 -IgnoreEmptyLines
        
      - name: Validate timestamps
        run: powershell -ExecutionPolicy Bypass -File scripts/validate_timestamps.ps1
        
      - name: Update QA Report
        run: powershell -ExecutionPolicy Bypass -File scripts/update_docs.ps1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: '**/*.md'
          
      - name: Check Markdown Links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.markdown-link-check.json'
