# MegaLinter Configuration
# https://megalinter.io/configuration/

# Disable plugins that cause false positives
DISABLE:
  - DEVSKIM
  - SECRETLINT

# Enable only necessary linters
ENABLE:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - MARKDOWN_MARKDOWNLINT
  - YAML_YAMLLINT
  - YAML_PRETTIER
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - COPYPASTE_JSCPD
  - REPOSITORY_CHECKOV
  - REPOSITORY_GRYPE
  - REPOSITORY_TRUFFLEHOG
  - REPOSITORY_GITLEAKS

# File extensions to lint
FILE_EXTENSIONS:
  - .js
  - .ts
  - .json
  - .md
  - .yml
  - .yaml
  - .svelte
  - .rs
  - .py

# Directories to exclude
EXCLUDED_DIRECTORIES:
  - .git
  - node_modules
  - target
  - sandbox/portable_bench/python-embed
  - src-tauri/target

# Markdown link check configuration
MARKDOWN_LINK_CHECK_CONFIG:
  # Retry on failure
  retry: 3
  # Timeout in seconds
  timeout: 10

# YAML linting
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml

# Markdown linting
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.yml
